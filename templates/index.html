<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groundnut Leaf Disease Detector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f7f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }
    header { text-align: center; margin-bottom: 30px; }
    header h1 { color: #2d6a2d; font-size: 28px; }
    header p { color: #555; margin-top: 6px; font-size: 15px; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .upload-area {
      border: 2px dashed #a8d5a8;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 20px;
    }
    .upload-area:hover { background: #f0faf0; }
    .upload-area p { color: #888; font-size: 14px; margin-top: 8px; }
    #preview {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 10px;
      display: none;
      margin-bottom: 16px;
    }
    input[type="file"] { display: none; }
    .btn {
      width: 100%;
      padding: 14px;
      background: #2d6a2d;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #1f4f1f; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    #result { margin-top: 24px; display: none; }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .disease-name { font-size: 20px; font-weight: 600; color: #2d6a2d; }
    .confidence-badge {
      background: #e6f4e6;
      color: #2d6a2d;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
    }
    .info-box {
      background: #f8faf8;
      border-left: 4px solid #2d6a2d;
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .info-box h4 {
      color: #444;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .info-box p { color: #555; font-size: 14px; line-height: 1.6; }
    .error-box {
      background: #fff0f0;
      border-left: 4px solid #e05555;
      border-radius: 6px;
      padding: 14px;
      color: #c0392b;
      font-size: 14px;
      margin-bottom: 12px;
    }
    #loading {
      text-align: center;
      color: #888;
      padding: 16px;
      display: none;
    }
  </style>
</head>
<body>
<header>
  <h1>🌿 Groundnut Leaf Disease Detector</h1>
  <p>Upload a leaf image to detect disease instantly using AI</p>
</header>
<div class="card">
  <img id="preview" src="" alt="Preview"/>
  <label for="fileInput">
    <div class="upload-area">
      <svg width="40" height="40" fill="none" stroke="#a8d5a8" stroke-width="1.5" viewBox="0 0 24 24">
        <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 12V4m0 0L8 8m4-4l4 4"/>
      </svg>
      <p>Click to upload a groundnut leaf image</p>
      <p style="font-size:12px; margin-top:4px;">JPG, PNG supported</p>
    </div>
  </label>
  <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)"/>
  <button class="btn" id="predictBtn" onclick="predict()" disabled>Detect Disease</button>
  <div id="loading">🔍 Analyzing leaf... please wait</div>
  <div id="result"></div>
</div>
<script>
  function previewImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    const preview = document.getElementById('preview');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    document.getElementById('predictBtn').disabled = false;
    document.getElementById('result').style.display = 'none';
  }
  async function predict() {
    const fileInput = document.getElementById('fileInput');
    if (!fileInput.files[0]) return;
    const btn = document.getElementById('predictBtn');
    btn.disabled = true;
    btn.textContent = 'Analyzing...';
    document.getElementById('loading').style.display = 'block';
    document.getElementById('result').style.display = 'none';
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    try {
      const response = await fetch('/predict', { method: 'POST', body: formData });
      const data = await response.json();
      document.getElementById('loading').style.display = 'none';
      btn.disabled = false;
      btn.textContent = 'Detect Disease';
      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      if (data.error) {
        resultDiv.innerHTML = `<div class="error-box">❌ Error: ${data.error}</div>`;
        return;
      }
      resultDiv.innerHTML = `
        ${data.warning ? `<div class="error-box">⚠️ ${data.warning}</div>` : ''}
        <div class="result-header">
          <span class="disease-name">${data.disease}</span>
          <span class="confidence-badge">${data.confidence}% confident</span>
        </div>
        <div class="info-box">
          <h4>About this disease</h4>
          <p>${data.description}</p>
        </div>
        <div class="info-box">
          <h4>Recommended treatment</h4>
          <p>${data.treatment}</p>
        </div>`;
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      btn.disabled = false;
      btn.textContent = 'Detect Disease';
      document.getElementById('result').innerHTML =
        `<div class="error-box">❌ Something went wrong. Make sure the server is running.</div>`;
    }
  }
</script>
</body>
</html>
